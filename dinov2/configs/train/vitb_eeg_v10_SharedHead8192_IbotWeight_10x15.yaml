MODEL:
  WEIGHTS: ''
dino:
  loss_weight: 1.0  # default is 1
  head_n_prototypes: 8192
ibot:
  loss_weight: 0.5  # default is 1
  separate_head: false
  head_n_prototypes: 8192
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_min_aspect: 0.15  # default=0.3
train:
  batch_size_per_gpu: 96  # bs=1024 is base_lr=4.0e-04
  num_workers: 5
  centering: sinkhorn_knopp
dataset:
  # data_root: ./samples  # test
  data_root: /public_bme2/grpdgshen/douyl/EEG_Dataset/TUEG/TUEG_250Hz/Segment
  num_channels: 19
  num_patches_per_channel: 30
  patch_time_dim: 250  # sampling rate 250Hz -> 1s patches
crops:
  local_crop_size_channels: 10  # 10channel
  local_crop_size_patches: 15    # 15second
augmentation:
  global_aug_probs: [1.0, 0.1] # Global crop-1 100% augmentation, Global crop-2 10% augmentation
  local_aug_prob: 0.5          # Local crops 50% augmentation

  scale_prob: 0.5              # Amplitude Scale
  scale_sigma: 0.1             # Amplitude Scale

  noise_prob: 0.5                # Gaussian Noise
  noise_std_range: [0.001, 0.01] # Gaussian Noise

  dropout_ch_prob: 0.05        # Channel Dropout
  dropout_max_channels: 1      # Channel Dropout
  dropout_as_noise_prob: 0     # Channel Dropout [Closed]

  time_shift_prob: 0           # Time Shift [Closed]
  max_time_shift_ratio: 0.01   # Time Shift

  phase_perturb_prob: 0.05      # Phase Perturbation
  phase_perturb_rad: 0.05       # Phase Perturbation
student:
  arch: vit_base
  pretrained_weights: ''
  drop_path_rate: 0.4
  num_register_tokens: 4
  ffn_layer: mlp
  block_chunks: 0
teacher:
  momentum_teacher: 0.994
  # warmup_teacher_temp_epochs: 60  # default=30
optim:
  epochs: 200
  weight_decay_end: 0.2
  base_lr: 8.0e-04  # learning rate for a batch size of 1024
  warmup_epochs: 30
  layerwise_decay: 1.0
evaluation:
  eval_period_iterations: 1000